[project]
name = "pytorch-datastream"
version = "0.0.0"
description = "Simple dataset to dataloader library for pytorch"
authors = [{ name = "NextML" }]
requires-python = ">=3.9,<4"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "pytorch",
    "machine",
    "learning",
    "dataset",
    "pipeline",
    "dataloader",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Other Environment",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=1.4.0",
    "numpy>=1.17.0,<2",
    "pandas>=1.0.5,<3",
    "pydantic>=2.0.0,<3",
]

[project.urls]
Repository = "https://github.com/nextml-code/pytorch-datastream"
Documentation = "https://nextml-code.github.io/pytorch-datastream"

[dependency-groups]
dev = [
    "pylint>=2.6.0,<3",
    "flake8>=3.8.4,<4",
    "pytest>=7.0.0,<8",
    "black>=23.1.0,<24",
    "mkdocs>=1.5.0,<2",
    "mkdocs-material>=9.0.0,<10",
    "pytest-codeblocks>=0.17.0,<0.18",
    "mkdocstrings[python]>=0.24.0,<0.25",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "datastream"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.pytest.ini_options]
testpaths = ["datastream", "docs", "tests"]
python_files = ["*.py", "*.md"]
addopts = "--doctest-modules --doctest-glob=*.md"
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ELLIPSIS"
markers = [
    "codeblocks: mark test to be collected from code blocks",
]

[tool.pytest-codeblocks]
pattern = "python"
test_files = ["docs/*.md"]
test_namespace = [
    "Dataset = datastream.Dataset",
    "Datastream = datastream.Datastream",
    "numpy_seed = datastream.tools.numpy_seed",
    "verify_split = datastream.tools.verify_split",
    "star = datastream.tools.star",
    "starcompose = datastream.tools.starcompose",
    "repeat_map_chain = datastream.tools.repeat_map_chain",
    "stratified_split = datastream.tools.stratified_split",
    "unstratified_split = datastream.tools.unstratified_split",
    "pd = pandas",
    "np = numpy",
    "torch = torch",
    "Image = PIL.Image",
    "Path = pathlib.Path",
    "datastream = datastream"
]
